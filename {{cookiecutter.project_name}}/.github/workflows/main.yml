name: Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Quality checks via the DCC-BS CI pipeline (mise run ci-check)
  quality:
    uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@a7a5611d4ea9bc55f27ca8bc22327181d0e0cbc0 # v10.0.0
    permissions:
      contents: read
      pull-requests: write
    with:
      # `mise run test:unit` runs in the tests job below.
      test-command: "echo 'Unit tests run in the tests job'"

  tests:
    name: Tests (Python {% raw %}${{ matrix.python-version }}{% endraw %})
    runs-on: ubuntu-latest
    needs: [quality]
    env:
      UV_PYTHON: {% raw %}${{ matrix.python-version }}{% endraw %}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["{{cookiecutter.python_version}}"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: DCC-BS/ci-workflows/actions/setup-mise@a7a5611d4ea9bc55f27ca8bc22327181d0e0cbc0 # v10.0.0

      - name: Run tests with coverage
        run: mise run test:unit
{%- if cookiecutter.codecov == "y" %}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: {% raw %}${{ secrets.CODECOV_TOKEN }}{% endraw %}
          files: ./coverage.xml
      - name: Upload test results to Codecov
        if: {% raw %}${{ !cancelled() }}{% endraw %}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: {% raw %}${{ secrets.CODECOV_TOKEN }}{% endraw %}
          files: ./junit.xml
          report_type: test_results
{%- endif %}
